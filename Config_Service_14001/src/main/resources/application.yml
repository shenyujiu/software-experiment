server:
  port: 14001
spring:
  application:
    name: "config-service"

  #  rabbitmq配置
  rabbitmq:
    stream:
      host: localhost
      port: 5672
      username: guest
      password: guest
      virtual-host: /
  #  springCloudBus配置
  cloud:
    config:
      server:
        git:
          uri: https://github.com/shenyujiu/software-experiment.git
          default-label: config
          username: shenyujiu
          password: 1223311syj
    bus:
      enabled: true
      destination: springCloudBus
    stream:
      bindings:
        springCloudBusInput:
          destination: springCloudBus
          group: "${spring.application.name}"
        springCloudBusOutput:
          destination: springCloudBus
management:
  endpoints:
    web:
      exposure:
        include: health,info,refesh,busrefesh

eureka:
  instance:
    prefer-ip-address: true #可以使用ip地址
    instance-id: "${spring.cloud.client.ip-address}:${server.port}" #实例唯一标识
    lease-renewal-interval-in-seconds: 5 #Eureka客户端向服务端发送心跳的时间间隔，默认30秒
    lease-expiration-duration-in-seconds: 15 #Eureka服务端删除超时客户端的容忍时间，默认90秒
  client:
    service-url:
      defaultZone: "http://eurekaService13000:13000/eureka,http://eurekaService13001:13001/eureka"