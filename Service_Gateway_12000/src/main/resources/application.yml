server:
  port: 12000
spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 1000
            response-timeout: 3s
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - "http://localhost:*"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                exposed-headers:
                  - Authorization
                allow-credentials: true
                max-age: 3600
          routes:
            - id: consumerService
              uri: lb://consumer-service
              predicates:
                - Path=/cart/get/**
              filters:
                - name: Retry
                  args:
                    retries: 2
                    methods:
                      - GET
                    series:
                      - SERVER_ERROR
                - name: CircuitBreaker
                  args:
                    name: consumerBreaker
                    fallbackUri: forward:/fallback/consumer
            - id: providerService
              uri: lb://provider-service
              predicates:
                - Path=/user/get/**
              filters:
                - name: Retry
                  args:
                    retries: 2
                    methods:
                      - GET
                    series:
                      - SERVER_ERROR
                - name: CircuitBreaker
                  args:
                    name: providerBreaker
                    fallbackUri: forward:/fallback/provider

gateway:
  auth:
    enabled: true
    header-name: Authorization
    header-prefix: "Bearer "
    valid-token: gateway-token
    exclude-paths:
      - /fallback/**

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        wait-duration-in-open-state:
          seconds: 5
        failure-rate-threshold: 50
        minimum-number-of-calls: 3
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      consumerBreaker:
        base-config: default
      providerBreaker:
        base-config: default

eureka:
  instance:
    prefer-ip-address: true
    instance-id: "${spring.cloud.client.ip-address}:${server.port}"
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
  client:
    service-url:
      defaultZone: http://localhost:13000/eureka/,http://localhost:13001/eureka/
