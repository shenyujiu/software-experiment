spring:
  rabbitmq:
    stream:
      host: localhost
      port: 5672
      username: guest
      password: guest
      virtual-host: /
  cloud:
    config:
      label: master
      name: consumer-service-10000
      profile: dev
      discovery:
        enabled: true
        service-id: config-service
    bus:
      enabled: true
      destination: springCloudBus
    stream:
      bindings:
        springCloudBusInput:
          destination: springCloudBus
          group: "${spring.application.name}"
        springCloudBusOutput:
          destination: springCloudBus
eureka:
  instance:
    prefer-ip-address: true #可以使用ip地址
    instance-id: "${spring.cloud.client.ip-address}:${server.port}" #实例唯一标识
    lease-renewal-interval-in-seconds: 5 #Eureka客户端向服务端发送心跳的时间间隔，默认30秒
    lease-expiration-duration-in-seconds: 15 #Eureka服务端删除超时客户端的容忍时间，默认90秒
  client:
    service-url:
      defaultZone: "http://eurekaService13000:13000/eureka,http://eurekaService13001:13001/eureka"